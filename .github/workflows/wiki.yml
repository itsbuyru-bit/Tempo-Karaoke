name: wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate wiki
        run: node scripts/wiki/generate.mjs --out wiki-build

      - name: Publish to GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::notice::WIKI_TOKEN is not configured; skipping Wiki publication."
            exit 0
          fi

          if ! git clone "https://x-access-token:${WIKI_TOKEN}@github.com/itsbuyru-bit/Tempo-Karaoke.wiki.git" wiki-repo; then
            echo "::notice::Wiki repository is not initialized yet. Create the first Wiki page in GitHub UI and rerun this workflow."
            exit 0
          fi

          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki-build/. wiki-repo/

          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "docs(wiki): regenerate from docs"
          git push
