name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TempoKaraoke.slnx -r win-x64

      - name: Test
        run: dotnet test tests/TempoKaraoke.Tests/TempoKaraoke.Tests.csproj -c Release --no-restore

      - name: Publish portable
        run: dotnet publish src/TempoKaraoke/TempoKaraoke.csproj -c Release -p:PublishProfile=portable-x64 --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Версия берётся из csproj, чтобы установщик и приложение не расходились.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path src/TempoKaraoke/TempoKaraoke.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          Write-Host "App version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\TempoKaraoke.iss" "/DMyAppVersion=$version"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempoKaraoke-Setup
          path: artifacts/TempoKaraoke-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/TempoKaraoke-Setup-*.exe
          generate_release_notes: true
